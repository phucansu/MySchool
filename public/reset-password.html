<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - MySchool</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js" defer></script>
</head>
<body>
    <div style="max-width: 440px; margin: 60px auto; padding: 0 16px;">
        <div class="auth-card" style="background: var(--card-bg, #fff); border-radius: 20px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
            <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: var(--secondary);">Đặt lại mật khẩu</h1>
            <p id="intro" style="font-size: 0.9rem; color: var(--text-gray); margin-bottom: 24px;">Nhập mật khẩu mới cho tài khoản của bạn.</p>

            <div id="error-msg" style="display: none; background: rgba(239,68,68,0.1); color: #EF4444; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem;"></div>
            <div id="success-msg" style="display: none; background: rgba(34,197,94,0.1); color: #16A34A; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 0.9rem;"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="new-password" placeholder="••••••••" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary auth-btn" style="width: 100%; margin-top: 8px;">Đặt lại mật khẩu</button>
            </form>

            <div style="text-align: center; margin-top: 20px;">
                <a href="auth.html" style="color: var(--text-gray); font-size: 0.9rem; text-decoration: none; font-weight: 500;">← Quay lại đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') ? 'http://localhost:5000/api' : '/api';

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const errorBox = document.getElementById('error-msg');
        const successBox = document.getElementById('success-msg');
        const form = document.getElementById('reset-form');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
            successBox.style.display = 'none';
        }
        function showSuccess(msg) {
            successBox.textContent = msg;
            successBox.style.display = 'block';
            errorBox.style.display = 'none';
        }

        if (!token) {
            form.style.display = 'none';
            showError('Liên kết đặt lại không hợp lệ. Vui lòng yêu cầu lại từ trang đăng nhập.');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showError('Mật khẩu xác nhận không trùng khớp.');
                return;
            }
            if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                showError('Mật khẩu phải có ít nhất 8 ký tự, gồm cả chữ và số.');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    form.style.display = 'none';
                    showSuccess('Đặt lại mật khẩu thành công! Đang chuyển tới trang đăng nhập...');
                    setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
                } else {
                    showError(data.msg || 'Không thể đặt lại mật khẩu.');
                }
            } catch (err) {
                showError('Lỗi kết nối server.');
            }
        });
    </script>
</body>
</html>
